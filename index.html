<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spain vs Argentina | Final - Match 104 Tickets | MetLife Stadium</title>
    <meta name="description" content="Get your tickets for Spain vs Argentina – Match 104 Final on Sunday, July 19 at MetLife Stadium. Secure your seats starting at $7,150.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- CSS Styles -->
    <style>
        :root {
            --primary: #FFD700; /* Gold accent */
            --secondary: #00A86B; /* Vibrant green accent */
            --dark-bg: #0d0f12;
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-light: #ffffff;
            --text-muted: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Hero Stadium Background with Dark Overlay */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to bottom, rgba(13, 15, 18, 0.7), rgba(13, 15, 18, 0.95)), 
                              url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            margin: auto;
        }

        /* Glassmorphism Card */
        .ticket-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Badge */
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff3366, #ff003c);
            color: white;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.3);
        }

        /* Matchup Title */
        .matchup {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .matchup span {
            display: block;
            font-size: 1.5rem;
            color: var(--primary);
            margin: 5px 0;
            font-weight: 400;
        }

        /* Event Details */
        .details-grid {
            margin: 30px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 0;
        }

        .detail-item {
            margin: 12px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .detail-item strong {
            color: #fff;
        }

        .detail-icon {
            color: var(--primary);
        }

        /* Pricing Area */
        .price-container {
            margin-bottom: 30px;
        }

        .price-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .price-amount {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 5px;
        }

        .price-currency {
            font-size: 1.5rem;
            vertical-align: super;
            color: var(--primary);
        }

        /* CTA Button */
        .cta-btn {
            display: block;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000;
            text-decoration: none;
            padding: 18px 30px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 165, 0, 0.2);
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 165, 0, 0.4);
            background: linear-gradient(135deg, #fff, #ffd700);
        }

        .cta-btn:active {
            transform: translateY(-1px);
        }

        /* Footer Guarantee */
        .guarantee {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Responsive Styles */
        @media (max-width: 480px) {
            .ticket-card {
                padding: 30px 20px;
            }
            .matchup {
                font-size: 1.8rem;
            }
            .price-amount {
                font-size: 2.5rem;
            }
        }
    </style>

</head>
